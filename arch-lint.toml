#:schema https://raw.githubusercontent.com/ynishi/arch-lint/v0.11.0/schema/arch-lint.schema.json
#
# Architecture rules, run by `cargo test` (crates/agent-caps-core/tests/architecture.rs).
# When a review catches a structural mistake, add the rule here so it is never caught by hand again.
#
# Scope paths are relative to this file's directory (the workspace root). `crate::`, `self::` and
# `super::` in a member crate resolve against that crate's `src/` (arch-lint 0.10+), so one file
# here covers every crate under crates/. References across crates (`use other_crate::..`) are not
# followed: a rule between crates is a `[dependencies]` decision, not an arch-lint one.

preset = "recommended"

[rules.no-sync-io]
# Blocking I/O is fine in a synchronous program. Turn this on when the code runs on an async runtime.
enabled = false

[[scopes]]
name = "domain"
paths = ["crates/agent-caps-core/src/domain/**"]

[[restrict-use]]
name = "pure-domain"
scope = "domain"
deny = [
    "std::fs", "std::fs::**",
    "std::process", "std::process::**",
    "std::env", "std::env::**",
    "std::net", "std::net::**",
    "std::time::SystemTime", "std::time::Instant",
    "tokio::fs", "tokio::fs::**", "tokio::process", "tokio::process::**", "tokio::net", "tokio::net::**",
    "rand", "rand::**", "git2", "git2::**", "reqwest", "reqwest::**",
    "chrono::Utc::now", "chrono::Local::now",
]
message = "domain is pure: take I/O, time and randomness as values; the umbrella crate's adapters read them."

[[restrict-use]]
name = "domain-knows-no-application"
scope = "domain"
deny = ["crate::application", "crate::application::**"]
message = "the domain is the top of the dependencies: the application uses it, never the other way."

[[scopes]]
name = "application"
paths = ["crates/agent-caps-core/src/application/**"]

[[restrict-use]]
name = "application-is-pure"
scope = "application"
deny = [
    # The I/O, time and randomness the domain refuses.
    "std::fs", "std::fs::**",
    "std::process", "std::process::**",
    "std::env", "std::env::**",
    "std::net", "std::net::**",
    "std::time::SystemTime", "std::time::Instant",
    "rand", "rand::**", "git2", "git2::**", "reqwest", "reqwest::**",
    "chrono::Utc::now", "chrono::Local::now",
    # No runtime of its own, and no shared mutable state.
    "tokio", "tokio::**", "async_std", "async_std::**", "smol", "smol::**",
    "futures::executor", "futures::executor::**",
    "std::thread", "std::thread::**", "std::sync::Mutex", "std::sync::RwLock",
    "std::sync::OnceLock", "std::sync::LazyLock", "std::sync::atomic", "std::sync::atomic::**",
    "parking_lot", "parking_lot::**",
]
message = "application is pure: it holds the port and the use cases. I/O, time, randomness, a runtime and shared mutable state live behind the Log port or with the caller."

[[scopes]]
name = "authority"
paths = ["crates/agent-caps-core/src/domain/authority.rs"]

[[restrict-use]]
name = "authority-is-lowest"
scope = "authority"
deny = [
    "super::policy", "super::policy::**", "crate::domain::policy", "crate::domain::policy::**",
    "super::catalog", "super::catalog::**", "crate::domain::catalog", "crate::domain::catalog::**",
    "super::change", "super::change::**", "crate::domain::change", "crate::domain::change::**",
    "super::event", "super::event::**", "crate::domain::event", "crate::domain::event::**",
    "super::state", "super::state::**", "crate::domain::state", "crate::domain::state::**",
    "super::predicate", "super::predicate::**", "crate::domain::predicate", "crate::domain::predicate::**",
    "super::adjust", "super::adjust::**", "crate::domain::adjust", "crate::domain::adjust::**",
    "super::judge", "super::judge::**", "crate::domain::judge", "crate::domain::judge::**",
    "super::tx", "super::tx::**", "crate::domain::tx", "crate::domain::tx::**",
    "super::set", "super::set::**", "crate::domain::set", "crate::domain::set::**",
]
message = "authority is the lowest layer of the domain: it knows nothing of policies, sets, catalogs, changes, events, adjustments, judgments, state, predicates or transactions, so who may loosen whose work can change without them."

[[scopes]]
name = "stored"
paths = ["crates/agent-caps-core/src/domain/stored.rs"]

[[restrict-use]]
name = "stored-is-a-leaf"
scope = "stored"
deny = ["crate::domain::**", "super::**"]
message = "stored is a leaf of the domain, below every module: it holds the version of the stored form, the error of a value of several parts and the form of a number that is not finite, so every module can use it and it needs none of them."

[[scopes]]
name = "policy"
paths = ["crates/agent-caps-core/src/domain/policy.rs"]

[[restrict-use]]
name = "policy-knows-no-set"
scope = "policy"
deny = [
    "super::set", "super::set::**", "crate::domain::set", "crate::domain::set::**",
]
message = "a policy graph knows nothing of the sets it is composed from: `set` reads the graph's one insert, never the other way, so the rule of what may enter a graph stays in one place."

[[scopes]]
name = "set"
paths = ["crates/agent-caps-core/src/domain/set.rs"]

[[restrict-use]]
name = "set-is-below-catalog"
scope = "set"
deny = [
    "super::catalog", "super::catalog::**", "crate::domain::catalog", "crate::domain::catalog::**",
    "super::change", "super::change::**", "crate::domain::change", "crate::domain::change::**",
    "super::tx", "super::tx::**", "crate::domain::tx", "crate::domain::tx::**",
    "super::judge", "super::judge::**", "crate::domain::judge", "crate::domain::judge::**",
]
message = "set is below catalog: it composes sets into one graph and knows nothing of what a catalog checks, how a change is judged or how an event is judged, so the composition is the same whoever reads it."
