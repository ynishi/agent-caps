[package]
name = "agent-caps-core"
description = "Core (SDK) of agent-caps: Policy catalog and judge for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

# serde is optional and off by default: the core has no dependency unless the stored form
# (`domain::stored`) is asked for.
[features]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
arch-lint.workspace = true
serde_json.workspace = true

# Without `required-features` the test would fail to build when the feature is off.
[[test]]
name = "stored"
required-features = ["serde"]
