[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/agent-caps"
homepage = "https://github.com/ynishi/agent-caps"
documentation = "https://docs.rs/agent-caps"
readme = "README.md"

[workspace.dependencies]
agent-caps-core = { path = "crates/agent-caps-core", version = "0.1.0" }
arch-lint = "0.11"
